<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>miPTY</title>
<meta name="theme-color" content="#0f766e">
<script src="config.js"></script>
<style>
  :root { --c: #0f766e; --bg: #f1f5f4; --ink: #0f172a; --muted: #64748b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); }
  body { display: flex; flex-direction: column; height: 100dvh; }
  header { background: var(--c); color: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
  header .av { width: 40px; height: 40px; border-radius: 12px; background: #fff; color: var(--c); display: grid; place-items: center; font-size: 18px; font-weight: 700; flex: none; }
  header .av svg { width: 30px; height: 30px; }
  header .t { font-weight: 600; font-size: 17px; line-height: 1.2; }
  header .s { font-size: 12px; opacity: .85; }
  #langs { margin-left: auto; display: flex; gap: 4px; }
  #langs button { border: 1px solid rgba(255,255,255,.5); background: none; color: #fff; border-radius: 6px; padding: 4px 7px; font-size: 12px; cursor: pointer; }
  #langs button.on { background: #fff; color: var(--c); font-weight: 600; }
  #chat { flex: 1; overflow-y: auto; padding: 16px 12px; display: flex; flex-direction: column; gap: 10px; }
  .m { max-width: 86%; padding: 9px 13px; border-radius: 16px; font-size: 15px; line-height: 1.45; word-wrap: break-word; }
  .u { align-self: flex-end; background: var(--c); color: #fff; border-bottom-right-radius: 5px; }
  .b { align-self: flex-start; background: #fff; border-bottom-left-radius: 5px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .b.wait { color: var(--muted); font-style: italic; }
  .b a { color: var(--c); }
  .b ul { margin: 4px 0; padding-left: 18px; }
  .fb { align-self: flex-start; margin: -6px 0 0 6px; display: flex; gap: 6px; }
  .fb button { border: 0; background: none; font-size: 15px; cursor: pointer; opacity: .55; padding: 2px; }
  .fb button:hover, .fb button.on { opacity: 1; }
  #chips { display: flex; gap: 8px; overflow-x: auto; padding: 0 12px 8px; }
  #chips button { flex: none; border: 1px solid var(--c); color: var(--c); background: #fff; border-radius: 999px; padding: 7px 12px; font-size: 13px; cursor: pointer; }
  form { display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: #fff; border-top: 1px solid #e2e8f0; }
  input { flex: 1; border: 1px solid #cbd5e1; border-radius: 999px; padding: 11px 15px; font-size: 16px; outline: none; }
  input:focus { border-color: var(--c); }
  form button { border: 0; background: var(--c); color: #fff; width: 46px; border-radius: 50%; font-size: 18px; cursor: pointer; }
  form button:disabled { opacity: .5; }
  footer { text-align: center; font-size: 11px; color: var(--muted); padding: 4px 12px 8px; background: #fff; }
  .dots::after { content: ""; animation: d 1.2s steps(4) infinite; }
  @keyframes d { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
</style>
</head>
<body>
<header>
  <div class="av" id="emoji"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 6h20a3 3 0 0 1 3 3v11a3 3 0 0 1-3 3H14l-6 5v-5H6a3 3 0 0 1-3-3V9a3 3 0 0 1 3-3z" fill="currentColor"/><circle cx="20.5" cy="12" r="3.2" fill="#fcd34d"/><path d="M7.5 18.2c1.7-1.6 3.4-1.6 5.1 0s3.4 1.6 5.1 0 3.4-1.6 5.1 0" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg></div>
  <div><div class="t" id="name">miPTY</div><div class="s" id="sub"></div></div>
  <div id="langs"><button data-l="es">ES</button><button data-l="en">EN</button><button data-l="fr">FR</button></div>
</header>
<div id="chat"></div>
<div id="chips"></div>
<form id="f">
  <input id="q" autocomplete="off" maxlength="500">
  <button id="send" aria-label="send">➤</button>
</form>
<footer id="foot"></footer>

<script>
const API = (window.MIPTY_API || "").replace(/\/$/, "");
const HOTEL = new URLSearchParams(location.search).get("h") || null;
let saved = ""; try { saved = localStorage.getItem("mipty_lang") || ""; } catch (e) {}
const L = saved || (navigator.language || "es").slice(0, 2);
let lang = ["es", "en", "fr"].includes(L) ? L : "en";
let T, HOTEL_INFO = null, started = false;
const ALL = {
  es: {sub: "Asistente automático · responde en segundos", ph: "Escribe tu pregunta…", wait: "Buscando en mis fichas", queue: n => `Hay ${n} pregunta(s) antes de la tuya`,
       foot: "Asistente automático de Neuralytic. La información es indicativa: confirma precios y horarios con el hotel.",
       hello: "¡Hola! Soy miPTY. Pregúntame sobre transporte, San Blas, Bocas, Boquete, presupuesto o seguridad en Panamá.",
       chips: ["¿Cómo llego del aeropuerto?", "¿Cómo ir a San Blas?", "¿Es seguro Casco Viejo de noche?"], err: "No pude conectarme. Inténtalo de nuevo."},
  en: {sub: "Automated assistant · answers in seconds", ph: "Type your question…", wait: "Looking in my notes", queue: n => `${n} question(s) ahead of yours`,
       foot: "Automated assistant by Neuralytic. Information is indicative: confirm prices and times with the hotel.",
       hello: "Hi! I'm miPTY. Ask me about getting around, San Blas, Bocas, Boquete, budget or safety in Panama.",
       chips: ["How do I get from the airport?", "How to get to San Blas?", "Is Casco Viejo safe at night?"], err: "I couldn't connect. Please try again."},
  fr: {sub: "Assistant automatique · répond en quelques secondes", ph: "Écris ta question…", wait: "Je cherche dans mes fiches", queue: n => `${n} question(s) avant la tienne`,
       foot: "Assistant automatique de Neuralytic. Informations indicatives : confirme prix et horaires avec l'hôtel.",
       hello: "Salut ! Je suis miPTY. Pose-moi tes questions sur les transports, les San Blas, Bocas, Boquete, le budget ou la sécurité au Panama.",
       chips: ["Comment venir de l'aéroport ?", "Comment aller aux San Blas ?", "Casco Viejo, c'est sûr le soir ?"], err: "Connexion impossible. Réessaie."},
};

let session = "";
try { session = localStorage.getItem("mipty_s") || ""; } catch (e) {}
if (!session) { session = Math.random().toString(36).slice(2) + Date.now().toString(36); try { localStorage.setItem("mipty_s", session); } catch (e) {} }

const $ = id => document.getElementById(id);

function applyLang(l) {   // change l'interface ; le bot répond dans la langue de la question (ou celle-ci si la question est trop courte)
  lang = l; T = ALL[l]; document.documentElement.lang = l;
  try { localStorage.setItem("mipty_lang", l); } catch (e) {}
  document.querySelectorAll("#langs button").forEach(b => b.classList.toggle("on", b.dataset.l === l));
  $("q").placeholder = T.ph; $("sub").textContent = T.sub;
  $("foot").textContent = (HOTEL_INFO && HOTEL_INFO.contact && HOTEL_INFO.contact[l] ? HOTEL_INFO.contact[l] + " · " : "") + T.foot;
  $("chips").innerHTML = "";
  for (const c of T.chips) { const b = document.createElement("button"); b.textContent = c; b.onclick = () => ask(c); $("chips").appendChild(b); }
  if (!started) {                                   // tant qu'aucune question n'est posée, l'accueil suit la langue
    $("chat").innerHTML = "";
    bubble("b", md((HOTEL_INFO && HOTEL_INFO.welcome && HOTEL_INFO.welcome[l]) || T.hello));
  }
}
document.querySelectorAll("#langs button").forEach(b => b.onclick = () => applyLang(b.dataset.l));

function esc(s) { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }
function md(s) {   // petit rendu : gras, italique, liens, listes
  const lines = esc(s).split("\n"); let out = "", inList = false;
  for (let l of lines) {
    l = l.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|\s)_(.+?)_(?=\s|$)/g, "$1<i>$2</i>")
         .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
         .replace(/(^|\s)(https?:\/\/[^\s<]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
    if (/^\s*[-•]\s+/.test(l)) { if (!inList) { out += "<ul>"; inList = true; } out += "<li>" + l.replace(/^\s*[-•]\s+/, "") + "</li>"; }
    else { if (inList) { out += "</ul>"; inList = false; } out += l + "<br>"; }
  }
  return (out + (inList ? "</ul>" : "")).replace(/(<br>)+$/, "");
}
function bubble(cls, html) {
  const d = document.createElement("div"); d.className = "m " + cls; d.innerHTML = html;
  $("chat").appendChild(d); $("chat").scrollTop = $("chat").scrollHeight; return d;
}
function feedbackRow(qa) {
  if (!qa) return;
  const r = document.createElement("div"); r.className = "fb";
  for (const [v, e] of [[1, "👍"], [-1, "👎"]]) {
    const b = document.createElement("button"); b.textContent = e;
    b.onclick = () => { r.querySelectorAll("button").forEach(x => x.classList.remove("on")); b.classList.add("on");
      fetch(API + "/api/feedback", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({qa_id: qa, value: v})}).catch(() => {}); };
    r.appendChild(b);
  }
  $("chat").appendChild(r);
}

async function ask(text) {
  text = text.trim(); if (!text) return;
  started = true; $("chips").style.display = "none"; $("q").value = ""; $("send").disabled = true;
  bubble("u", esc(text));
  const w = bubble("b wait", `<span class="dots">${esc(T.wait)}</span>`);
  try {
    const r = await fetch(API + "/api/ask", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({question: text, session, hotel: HOTEL, lang})});
    const d = await r.json();
    if (!r.ok) { w.className = "m b"; w.innerHTML = esc(d.message || T.err); $("send").disabled = false; return; }
    while (true) {
      await new Promise(res => setTimeout(res, 2000));
      const j = await (await fetch(API + "/api/job/" + d.job)).json();
      if (j.status === "done" || j.status === "error") {
        w.className = "m b"; w.innerHTML = md(j.answer); feedbackRow(j.qa_id); break;
      }
      if (j.status === "queued" && j.position > 1) w.innerHTML = `<span class="dots">${esc(T.queue(j.position - 1))}</span>`;
      else if (j.partial) w.innerHTML = md(j.partial);
      else w.innerHTML = `<span class="dots">${esc(T.wait)}</span>`;
      $("chat").scrollTop = $("chat").scrollHeight;
    }
  } catch (e) { w.className = "m b"; w.textContent = T.err; }
  $("send").disabled = false; $("q").focus();
}
$("f").onsubmit = e => { e.preventDefault(); ask($("q").value); };

async function start() {
  if (HOTEL) {
    try {
      const h = await (await fetch(API + "/api/hotel/" + encodeURIComponent(HOTEL))).json();
      if (h.name) {
        document.title = h.name; $("name").textContent = h.name; $("emoji").textContent = h.name.split(/\s+/).filter(w => /^[A-Za-zÀ-ÿ]/.test(w) && !/^(hotel|hostal|the|el|la|los|las)$/i.test(w)).slice(0, 2).map(w => w[0].toUpperCase()).join("") || h.name[0];
        document.documentElement.style.setProperty("--c", h.color || "#0f766e");
        document.querySelector('meta[name="theme-color"]').content = h.color || "#0f766e";
        HOTEL_INFO = h;
      }
    } catch (e) { console.error("miPTY: API injoignable", API, e); }
  }
  if (!API || /TON-DOMAINE/.test(API)) console.error("miPTY: config.js n'a pas l'adresse du serveur", API);
  applyLang(lang);
}
start();
</script>
</body>
</html>
