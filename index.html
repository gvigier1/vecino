<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5c4d">
<title>Vecino</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="static/icon-192.png">
<link rel="stylesheet" href="static/style.css?v=2">
</head>
<body>
<div id="app"><div class="splash">Cargando…</div></div>
<div id="toast" class="toast" hidden></div>
<div id="modal" class="modal" hidden><div class="modal-box"><div id="modal-body"></div></div></div>
<div id="alarm" class="alarm" hidden></div>
<script>
// config.js donne l'adresse du serveur quand la page est hébergée ailleurs (GitHub Pages).
// Chargé sans cache : quand l'adresse du tunnel change, la page la prend tout de suite.
(function () {
  function app() { var s = document.createElement("script"); s.src = "static/app.js?v=2"; document.body.appendChild(s); }
  var c = document.createElement("script"); c.src = "config.js?t=" + Date.now();
  c.onload = app; c.onerror = app; document.body.appendChild(c);
})();
</script>
</body>
</html>
